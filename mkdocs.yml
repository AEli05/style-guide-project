site_name: Стайлгайд аналитической документации
site_description: Правила написания и оформления аналитических документов
site_author: Елизарова Анастасия
site_url: https://AEli05.github.io/style-guide-project/
repo_url: https://github.com/AEli05/style-guide-project
repo_name: style-guide-project
edit_uri: edit/main/docs/

theme:
  name: material
  language: ru
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Темная тема
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Светлая тема

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Главная: index.md
  - Основы:
      - Назначение и аудитория: purpose.md
      - Типы документов и шаблоны: doc-types.md
  - Текст:
      - Стиль изложения: language.md
      - Орфография и пунктуация: spelling.md
      - Числа, даты и единицы: numbers.md
  - Аналитика:
      - Результаты экспериментов: statistics.md
      - SQL и код: code.md
      - Графики, таблицы и дашборды: charts.md
  - Оформление:
      - Правила Markdown: markdown.md
      - Глоссарий: glossary.md
      - Проверка и чек-лист: review.md
      - Доступность текста: accessibility.md
  - Примеры:
      - Описание SQL-витрины: examples/datamart.md
      - Отчет по A/B-тесту: examples/ab-test-report.md
